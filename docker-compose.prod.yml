version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: todo-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata-prod:/var/lib/postgresql/data

  backend:
    # Instead of building from code, we pull directly from Docker Hub!
    image: ${DOCKER_USERNAME}/todo-backend:${IMAGE_TAG}
    container_name: todo-backend-prod
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    # Pulling the frontend directly from Docker Hub
    image: ${DOCKER_USERNAME}/todo-frontend:${IMAGE_TAG}
    container_name: todo-frontend-prod
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata-prod:
