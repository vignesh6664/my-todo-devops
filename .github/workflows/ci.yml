name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  verify-application:
    name: Code Checks & Docker Build
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js and PNPM
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Workspace Dependencies
        run: pnpm install

      # 3. Frontend Build Check
      - name: Frontend Build Check
        run: |
          echo "Running Frontend checks..."
          pnpm --filter ./frontend run build

      # 4. Backend Dependency Check
      - name: Backend Dependency Check
        run: |
          echo "Running Backend checks..."
          # Generate the Prisma client first, then build
          pnpm --filter ./backend run db:generate
          pnpm --filter ./backend run build

      # 5. Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build and Push Backend Image
      - name: Build and Push Backend Image
        run: |
          echo "Building Backend Image..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest ./backend
          
          echo "Pushing Backend Image..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest

      # 7. Build and Push Frontend Image
      - name: Build and Push Frontend Image
        run: |
          echo "Building Frontend Image..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest ./frontend
          
          echo "Pushing Frontend Image..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
