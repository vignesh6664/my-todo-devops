name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  verify-application:
    name: Code Checks & Docker Build
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js and PNPM
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Workspace Dependencies
        run: pnpm install

      # 3. Frontend Build Check
      - name: Frontend Build Check
        run: |
          echo "Running Frontend checks..."
          pnpm --filter ./frontend run build

      # 4. Backend Dependency Check
      - name: Backend Dependency Check
        run: |
          echo "Running Backend checks..."
          # Generate the Prisma client first, then build
          pnpm --filter ./backend run db:generate
          pnpm --filter ./backend run build

      # 5. Authenticate with Docker Hub (Only when pushing to main)
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build Backend Image (and push ONLY if on main)
      - name: Build Backend Image
        run: |
          echo "Building Backend Image..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest ./backend
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Pushing Backend Image..."
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
          else
            echo "Skipping push. This is a PR, so we just wanted to verify it builds successfully!"
          fi

      # 7. Build Frontend Image (and push ONLY if on main)
      - name: Build Frontend Image
        run: |
          echo "Building Frontend Image..."
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest ./frontend
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Pushing Frontend Image..."
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
          else
            echo "Skipping push. This is a PR, so we just wanted to verify it builds successfully!"
          fi

      # 8. Print Success Summary (Only if on main)
      - name: Print Push Summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Successfully pushed:"
          echo ""
          echo "Frontend:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}"
          echo ""
          echo "Backend:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}"
          
          # This creates a beautiful Markdown summary on the GitHub Actions UI page!
          echo "### 🚀 Successfully published Docker Images!" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** \`${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** \`${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
