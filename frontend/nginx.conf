server {
    listen 80;
    server_name localhost;

    # Serve the React App
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # This allows React Router to handle page refreshes seamlessly
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for Backend API
    location /api/ {
        # This strips the "/api" prefix before sending it to the backend.
        # e.g., /api/todos becomes /todos
        rewrite ^/api/(.*)$ /$1 break;
        
        # Forward requests to the 'backend' container on port 8080
        proxy_pass http://backend:8080;
        
        # Standard proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
